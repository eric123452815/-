import requests
import os

WEBHOOK_URL = os.environ['DISCORD_WEBHOOK_URL']

data = {
    "content": "早安！這是每天的自動提醒貼文。",
    "username": "Daily Bot",
    "thread_name": "每日發文",   # 論壇會自動生成主題
    # "applied_tags": ["公告"]    # 如果你的論壇有標籤可以加
}

response = requests.post(WEBHOOK_URL, json=data)
if response.status_code == 204:
    print("發文成功！")
else:
    print("失敗：", response.text)

