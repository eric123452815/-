name: Daily Discord Post

on:
  schedule:
    - cron: '0 0 * * *' # UTC時間，每天台灣早上8點請設為 0 0
  workflow_dispatch:    # 可手動觸發

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: 發送 Discord Webhook
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -X POST "$WEBHOOK_URL" \
          -H "Content-Type: application/json" \
          -d '{
            "content": "早安！這是每天自動發文。",
            "username": "Daily Bot",
            "thread_name": "aa",
            "applied_tags": ["公告"]
          }'
